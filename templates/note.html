<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><meta name="description" content="{{description}}"><style>
:root{color-scheme:light;--paper:#f8f7f4;--ink:#1c1c1b;--muted:#77736c;--line:#dedbd5;--accent:#a8492c;--serif:Georgia,Cambria,"Times New Roman",serif;--sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}.wrap{max-width:920px;margin:auto;padding:28px 30px 72px}nav{display:flex;justify-content:space-between;align-items:center;font:12px/1.3 var(--mono);letter-spacing:.025em}nav a{color:var(--ink);text-decoration:none}.brand{font-weight:600}.github{color:var(--muted);border-bottom:1px solid transparent}.github:hover{color:var(--accent);border-color:currentColor}main{margin-top:112px}.kicker,.eyebrow,.meta,time,.note-head>span{font:11px/1.5 var(--mono);letter-spacing:.035em;color:var(--muted)}.kicker{margin:0 0 16px;text-transform:uppercase}.index-head{max-width:620px;margin-bottom:96px}.index-head h1,.note h1{font-family:var(--serif);font-weight:400;letter-spacing:-.045em;line-height:1.02;margin:0}.index-head h1{font-size:clamp(40px,6.2vw,72px)}.lede{color:var(--muted);font-size:17px;line-height:1.5;max-width:480px;margin:28px 0 0}.year-group{margin:0 0 54px}.year-group h2{font:11px/1 var(--mono);letter-spacing:.06em;color:var(--muted);margin:0 0 12px}.entries{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}.entries li{border-bottom:1px solid var(--line)}.entries a{display:grid;grid-template-columns:92px minmax(0,1fr);gap:22px;padding:18px 0 19px;color:inherit;text-decoration:none}.entries a:hover .entry-title{color:var(--accent)}.entry-title{font-size:17px;font-weight:600;line-height:1.35}.arrow{font-size:14px;color:var(--muted);margin-left:3px}.entries p{font-size:14px;line-height:1.5;color:var(--muted);margin:4px 0 5px;max-width:560px}.empty{color:var(--muted)}.note{max-width:680px;margin:auto}.note-head{margin-bottom:56px}.note h1{font-size:clamp(44px,6vw,68px);margin-top:16px}.note-description{font-family:var(--serif);font-size:23px;line-height:1.35;color:#5f5a54;margin:22px 0 0}.note-head>span{display:block;margin-top:16px}.prose{font-family:var(--serif);font-size:20px;line-height:1.7;overflow-wrap:anywhere}.prose h2,.prose h3{font-family:var(--sans);line-height:1.2;letter-spacing:-.025em;margin:2.4em 0 .7em}.prose h2{font-size:28px}.prose h3{font-size:21px}.prose a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}.prose img,.prose video{max-width:100%;height:auto}.prose pre{overflow:auto;padding:20px;background:#eeece7;font:13px/1.55 var(--mono)}.prose code{font-family:var(--mono);font-size:.8em}.prose blockquote{margin:2em 0;padding-left:22px;border-left:2px solid var(--accent);color:#68625c}.prose table{display:block;overflow:auto;border-collapse:collapse;font-family:var(--sans);font-size:15px}.prose th,.prose td{border-bottom:1px solid var(--line);padding:9px 13px;text-align:left}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}footer{margin-top:112px;padding-top:14px;border-top:1px solid var(--line);font:11px/1.5 var(--mono);color:var(--muted)}@media(max-width:620px){.wrap{padding:22px 20px 52px}main{margin-top:74px}.index-head{margin-bottom:65px}.entries a{grid-template-columns:1fr;gap:4px}.entries time{order:2}.entry-copy{order:1}.note-head{margin-bottom:42px}.prose{font-size:19px}}@media(prefers-reduced-motion:no-preference){.entries a,.github{transition:color .16s,border-color .16s}}
</style></head><body><div class="wrap"><nav><a class="brand" href="{{home}}">nibzard <span aria-hidden="true">/</span> scratch</a><a class="github" href="{{github}}">github ↗</a></nav><main>{{body}}</main><footer>Made along the way.</footer></div></body></html>
