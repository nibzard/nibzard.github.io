<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><meta name="description" content="{{description}}"><style>
:root{color-scheme:light;--paper:#faf8f5;--ink:#242321;--muted:#706c65;--line:#e5e0d8;--accent:#c3471e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 system-ui,-apple-system,sans-serif}.wrap{max-width:800px;margin:auto;padding:44px 28px 80px}nav{font:12px ui-monospace,monospace;letter-spacing:.04em;margin-bottom:70px}nav a{color:var(--muted);text-decoration:none}h1{font-size:clamp(30px,6vw,46px);line-height:1.15;letter-spacing:-.045em;margin:0 0 24px}h2,h3{line-height:1.3;margin-top:2em}a{color:var(--accent);text-underline-offset:4px}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.lede{color:var(--muted);margin-bottom:42px}.meta,time{font:12px/1.6 ui-monospace,monospace;color:var(--muted)}article{overflow-wrap:anywhere}article img,article video{max-width:100%;height:auto}pre{overflow:auto;padding:20px;background:#eeebe5;border-radius:7px;font-size:14px}code{font-family:ui-monospace,monospace}blockquote{margin-left:0;padding-left:22px;border-left:3px solid var(--accent);color:var(--muted)}table{display:block;overflow:auto;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px 16px;text-align:left}.entries{padding:0;list-style:none}.entries li{border-top:1px solid var(--line)}.entries a{display:block;padding:24px 0;text-decoration:none;color:inherit}.entry-title{font-weight:650;font-size:20px}.entries a:hover .entry-title{color:var(--accent)}time{float:right;margin-top:6px}.entries p{font-size:15px;color:var(--muted);margin:8px 0}.empty{color:var(--muted)}footer{margin-top:80px;border-top:1px solid var(--line);padding-top:16px;font:12px ui-monospace,monospace;color:var(--muted)}@media(max-width:520px){.wrap{padding:28px 20px 60px}nav{margin-bottom:48px}time{display:block;float:none;margin-top:6px}}@media(prefers-reduced-motion:no-preference){a{transition:color .15s}}
</style></head><body><div class="wrap"><nav><a href="{{home}}">{{siteTitle}}</a></nav><main>{{body}}</main><footer>Notes & experiments · independently published</footer></div></body></html>
